# my_models.toml
# Inventario de todos los modelos configurados en OpenCode.
# Fuente de verdad para qué modelos existen y dónde se usan.

[agents]

# opencode.jsonc
Confucius = "DeepSeek V4 Pro"
DeepBro = "DeepSeek V4 Flash"
DeepJunior = "DeepSeek V4 Flash"
DeepTerminal = "DeepSeek V4 Flash"
Magician = "Claude Opus 4.8"
Queen = "Qwen 3.7 Max"
Kong = "Kimi K2.6"

# oh-my-openagent.jsonc
atlas = "MiMo v2.5 Pro"
hephaestus = "MiMo v2.5 Pro"
multimodal-looker = "MiMo v2.5 Pro"
oracle = "MiMo v2.5 Pro"
prometheus = "MiMo v2.5 Pro"
sisyphus = "MiMo v2.5"
metis = "MiMo v2.5"
momus = "MiMo v2.5"
explore = "MiMo v2.5"
librarian = "MiMo v2.5"
sisyphus-junior = "MiMo v2.5"

[categories]

# oh-my-openagent.jsonc
deep               = "MiMo v2.5 Pro"
visual-engineering = "MiMo v2.5"
ultrabrain         = "MiMo v2.5"
artistry           = "MiMo v2.5"
quick              = "MiMo v2.5"
unspecified-low    = "MiMo v2.5"
unspecified-high   = "MiMo v2.5"
writing            = "MiMo v2.5"


[modes]

[modes.cheap_go]
DeepSeek V4 Flash = "opencode-go/deepseek-v4-flash"
DeepSeek V4 Pro = "opencode-go/deepseek-v4-pro"
MiMo v2.5 = "opencode-go/mimo-v2.5"
MiMo v2.5 Pro = "opencode-go/mimo-v2.5-pro"
Qwen 3.7 Max = "opencode-go/qwen3.7-max"
Kimi K2.6 = "opencode-go/kimi-k2.6"
Claude Opus 4.8 = "opencode/claude-opus-4-8"     # Zen

[modes.cheap_openrouter]
DeepSeek V4 Flash = "deepseek/deepseek-v4-flash" # DeepSeek API
DeepSeek V4 Pro = "deepseek/deepseek-v4-pro"     # DeepSeek API
MiMo v2.5 = "openrouter/xiaomi/mimo-v2.5"
MiMo v2.5 Pro = "openrouter/xiaomi/mimo-v2.5-pro"
Qwen 3.7 Max = "openrouter/qwen/qwen3.7-max"
Kimi K2.6 = "openrouter/moonshotai/kimi-k2.6"
Claude Opus 4.8 = "openrouter/anthropic/claude-opus-4-8"
