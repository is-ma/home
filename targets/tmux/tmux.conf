# ============================================
# TMUX CONFIG — Ctrl+Space prefix
# ============================================

# --- PREFIX: Ctrl+Space ---
# Por qué Ctrl+Space?
#   - No choca con emacs mode (Ctrl+A, Ctrl+E, Ctrl+W, etc.)
#   - No choca con i3 (usa Mod4)
#   - No choca con Albert (hotkey=Meta+a)
#   - Cómodo de presionar con ambas manos
unbind C-b
set -g prefix C-Space
bind -T prefix C-Space send-prefix

# --- MOUSE ---
set -g mouse on

# --- SCROLLBACK ---
set -g history-limit 50000

# --- TERMINAL ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",alacritty:RGB"
set -g escape-time 50

# --- WINDOWS ---
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g aggressive-resize on

# --- STATUS BAR (minimal) ---
set -g status-interval 5
set -g status-style bg=colour237,fg=colour223
set -g status-left "#[fg=colour214] #S #[default]"
set -g status-left-length 40
set -g status-right "#[fg=colour241] %Y-%m-%d %H:%M #[default]"
set -g status-right-length 60
set -g window-status-current-style fg=colour214,bold
set -g window-status-style fg=colour243
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g status-justify left

# --- COPY MODE ---
set -g mode-keys vi

# --- BINDINGS (útiles, respetan defaults) ---
# Ventanas: crear desde el directorio actual
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Recargar config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "  tmux.conf reloaded"

# Moverse entre paneles con Alt+h/j/k/l (como Helix)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Redimensionar paneles con Alt+Shift+h/j/k/l
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# --- INICIALIZACIÓN ---
# Mostrar tecla prefix al iniciar sesión
display-message "  Prefix: Ctrl+Space"
