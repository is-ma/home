# ============================================
# TMUX CONFIG — Ctrl+Space prefix
# ============================================

# --- PREFIX: Ctrl+Space ---
# Por qué Ctrl+Space?
#   - No choca con emacs mode (Ctrl+A, Ctrl+E, Ctrl+W, etc.)
#   - No choca con i3 (usa Mod4)
#   - No choca con Albert (hotkey=Meta+a)
#   - Cómodo de presionar con ambas manos
unbind C-b
set -g prefix C-Space
bind -T prefix C-Space send-prefix

# --- MOUSE ---
set -g mouse on

# --- SCROLLBACK ---
set -g history-limit 50000

# --- TERMINAL ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",alacritty:RGB"
set -g escape-time 50

# --- PANEL BORDERS (sólidos, verde suspiro de LazyGit) ---
set -g pane-border-style fg='#3f4830'
set -g pane-active-border-style fg='#3f4830'

# --- DISPLAY PANES (más lento, números más grandes) ---
set -g display-panes-time 5000
set -g display-panes-colour colour214
set -g display-panes-active-colour colour214

# --- WINDOWS ---
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g aggressive-resize on

# --- STATUS BAR (Gruvbox Material Dark, fondo = Alacritty) ---
set -g status-interval 5
set -g status-style bg=default,fg=colour223
set -g status-left "#[fg=#a9b665,bg=#3f4830] #S #[default]"
set -g status-left-length 40
set -g status-right ""
set -g status-right-length 60
set -g window-status-style bg=default,fg='#3f4830'
set -g window-status-current-style bg=default,fg='#a9b665'
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-separator ""
set -g status-justify left

# --- COPY MODE ---
set -g mode-keys vi

# --- BINDINGS (útiles, respetan defaults) ---
# Ventanas: crear desde el directorio actual
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Recargar config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "  tmux.conf reloaded"

# Moverse entre paneles
# Alt + vim-keys (como Helix)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
# Alt + flechas  (alternativa universal)
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R
# PREFIX + flechas (default, sin Alt)
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

# Redimensionar paneles
# Alt + Shift + vim-keys (1 celda)
bind -n M-H resize-pane -L 1
bind -n M-J resize-pane -D 1
bind -n M-K resize-pane -U 1
bind -n M-L resize-pane -R 1
# Alt + Shift + flechas (1 celda)
bind -n M-S-Left resize-pane -L 1
bind -n M-S-Down resize-pane -D 1
bind -n M-S-Up resize-pane -U 1
bind -n M-S-Right resize-pane -R 1
# PREFIX + Ctrl+flechas (default, resize 1 celda)
bind C-Left resize-pane -L
bind C-Down resize-pane -D
bind C-Up resize-pane -U
bind C-Right resize-pane -R

# --- INICIALIZACIÓN ---
# Mostrar tecla prefix al iniciar sesión
display-message "  Prefix: Ctrl+Space"
